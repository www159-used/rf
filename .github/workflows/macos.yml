name: macOS
on: [push, pull_request]
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo publish --dry-run --locked
      - name: Verify Cargo installation from packaged sources
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          cargo install --path "target/package/rf-copy-$version" --locked --root "$RUNNER_TEMP/rf-install"
          "$RUNNER_TEMP/rf-install/bin/rf" --version
          "$RUNNER_TEMP/rf-install/bin/rff" --version
# Real clipboard and Finder checks require a logged-in macOS desktop session.
# Publishing to crates.io is a separate, intentional cargo publish operation.
