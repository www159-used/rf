name: CI

on:
  push:
    branches: [main]
    tags: ['v*', 'rf-copy-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  check:
    name: macOS (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.runner }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting, Clippy, and tests
        run: bash scripts/check.sh
      - name: Build and verify the crates.io package
        run: cargo package --locked
      - name: Verify Cargo installation from packaged sources
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          cargo install --path "target/package/rf-copy-$version" --locked --offline \
            --root "$RUNNER_TEMP/rf-install" --target-dir target/install
          test "$("$RUNNER_TEMP/rf-install/bin/rf" --version)" = "rf $version"
          # Both entry points share the rf CLI name and package version.
          test "$("$RUNNER_TEMP/rf-install/bin/rff" --version)" = "rf $version"
          "$RUNNER_TEMP/rf-install/bin/rf" --help
          "$RUNNER_TEMP/rf-install/bin/rff" --help
# Real clipboard and Finder checks require a logged-in macOS desktop session.
# Maintainers publish to crates.io locally with cargo-release.
